name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

# Fail loudly if a build would need to modify go.mod/go.sum, so CI always
# tests the committed dependency graph.
env:
  GOFLAGS: -mod=readonly

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Don't leave the repo-scoped token in .git/config after checkout.
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "stable"
      - name: Build
        run: |
          go version
          go build -race -v ./...
      - name: Test
        run: go test -race -v ./...
      - name: Bench
        run: go test -run=XXX -bench=. ./...

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Don't leave the repo-scoped token in .git/config after checkout.
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "stable"
      - name: Build
        run: |
          go version
          go build -race -v ./...
      - name: Test
        run: go test -race -v ./...
      - name: Bench
        run: go test -run=XXX -bench=. ./...

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Don't leave the repo-scoped token in .git/config after checkout.
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "stable"
      - name: Install MinGW (for gcc)
        # Pin the CGO toolchain by content hash instead of trusting the
        # Chocolatey feed by version. GCC 16.1.0 (winlibs, UCRT runtime); the
        # SHA-256 is the winlibs GitHub release asset digest, re-verified on
        # every run, so swapped bytes fail the job rather than silently running
        # an unexpected toolchain. To bump: update url and sha256 together from
        # the release asset's "digest" field.
        #
        # Previous approach (pinned by version only, not content hash):
        #   choco install -y mingw --version=16.1.0
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $url = 'https://github.com/brechtsanders/winlibs_mingw/releases/download/16.1.0posix-14.0.0-ucrt-r3/winlibs-x86_64-posix-seh-gcc-16.1.0-mingw-w64ucrt-14.0.0-r3.zip'
          $sha = '4273565109cd8ab8ecef1b0dc2a56fd7f5c7ee0885840a1c011b9325160ec0c3'
          Invoke-WebRequest -Uri $url -OutFile mingw.zip
          $got = (Get-FileHash mingw.zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $sha) { throw "MinGW checksum mismatch: expected $sha, got $got" }
          Expand-Archive -Path mingw.zip -DestinationPath C:\mingw-toolchain -Force
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\mingw-toolchain\mingw64\bin'
      - name: Build
        run: |
          go version
          $env:CGO_ENABLED=1; go build -race -v ./...
      - name: Test
        run: |
          $env:CGO_ENABLED=1; go test -race -v ./...
      - name: Bench
        run: go test -run=XXX -bench=. ./...

  # Cross-compile the platform implementations that have no native CI runner,
  # so a build break on a BSD/Solaris/AIX target is caught.
  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: freebsd
            goarch: amd64
          - goos: dragonfly
            goarch: amd64
          - goos: netbsd
            goarch: amd64
          - goos: openbsd
            goarch: amd64
          - goos: solaris
            goarch: amd64
          - goos: aix
            goarch: ppc64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Don't leave the repo-scoped token in .git/config after checkout.
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "stable"
      - name: Cross-compile (${{ matrix.goos }}/${{ matrix.goarch }})
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go version
          go build -v ./...
          go vet ./...

  # Flag known-vulnerable dependencies (e.g. golang.org/x/sys) automatically.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Don't leave the repo-scoped token in .git/config after checkout.
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "stable"
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
