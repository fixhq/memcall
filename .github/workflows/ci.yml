name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

# Fail loudly if a build would need to modify go.mod/go.sum, so CI always
# tests the committed dependency graph.
env:
  GOFLAGS: -mod=readonly

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "stable"
      - name: Build
        run: |
          go version
          go build -race -v ./...
      - name: Test
        run: go test -race -v ./...
      - name: Bench
        run: go test -run=XXX -bench=. ./...

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "stable"
      - name: Build
        run: |
          go version
          go build -race -v ./...
      - name: Test
        run: go test -race -v ./...
      - name: Bench
        run: go test -run=XXX -bench=. ./...

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "stable"
      - name: Install MinGW (for gcc)
        run: choco install -y mingw --version=16.1.0
      - name: Build
        run: |
          go version
          $env:CGO_ENABLED=1; go build -race -v ./...
      - name: Test
        run: |
          $env:CGO_ENABLED=1; go test -race -v ./...
      - name: Bench
        run: go test -run=XXX -bench=. ./...

  # Cross-compile the platform implementations that have no native CI runner,
  # so a build break on a BSD/Solaris/AIX target is caught.
  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: freebsd
            goarch: amd64
          - goos: dragonfly
            goarch: amd64
          - goos: netbsd
            goarch: amd64
          - goos: openbsd
            goarch: amd64
          - goos: solaris
            goarch: amd64
          - goos: aix
            goarch: ppc64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "stable"
      - name: Cross-compile (${{ matrix.goos }}/${{ matrix.goarch }})
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go version
          go build -v ./...
          go vet ./...

  # Flag known-vulnerable dependencies (e.g. golang.org/x/sys) automatically.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "stable"
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
